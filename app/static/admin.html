<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogniva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #222222;
            line-height: 1.5;
            padding: 28px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            width: 100%;
        }

        /* Login Screen */
        #loginScreen {
            max-width: 360px;
            margin: 60px auto 0 auto;
            text-align: center;
            padding: 20px 0;
        }

        #loginScreen h1 {
            font-size: 20px;
            font-weight: 600;
            color: #111111;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
        }

        #loginScreen p {
            font-size: 13px;
            color: #777777;
            margin-bottom: 24px;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Dashboard Screen */
        #dashboardScreen {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #eeeeee;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #111111;
            letter-spacing: -0.4px;
        }

        .header-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-btn {
            font-size: 13px;
            color: #666666;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .header-btn:hover {
            color: #111111;
            border-color: #999999;
            background: #f7f7f7;
        }

        /* Alerts */
        #alertMsg {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #d0d0d0;
            background: #ffffff;
            color: #222222;
        }

        /* Add Subscriber Section - Flat, no gray container */
        .add-section {
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 24px;
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #555555;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="email"],
        input[type="password"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 16px; /* 16px prevents iOS browser auto-zoom */
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            background: #ffffff;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.15s ease;
        }

        input:focus {
            border-color: #222222;
        }

        .btn-submit {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            background: #222222;
            color: #ffffff;
            border: 1px solid #222222;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .btn-submit:hover {
            background: #000000;
            border-color: #000000;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-note {
            font-size: 12px;
            color: #888888;
            margin-top: 8px;
        }

        /* Subscribers List */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .list-title {
            font-size: 12px;
            font-weight: 600;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .list-count {
            font-size: 12px;
            color: #888888;
        }

        .subscribers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Individual Subscriber Item */
        .sub-item {
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            padding: 16px 18px;
            transition: border-color 0.15s ease;
        }

        .sub-item:hover {
            border-color: #cccccc;
        }

        .sub-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        /* Clickable email address */
        .sub-email-btn {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #111111;
            text-align: left;
            cursor: pointer;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.4;
            display: inline-block;
        }

        .sub-email-btn:hover {
            text-decoration: underline;
            color: #000000;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-active {
            background: #f2f2f2;
            color: #222222;
            border: 1px solid #dcdcdc;
        }

        .badge-paused {
            background: #ffffff;
            color: #888888;
            border: 1px solid #e5e5e5;
        }

        .sub-item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #f6f6f6;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sub-date {
            font-size: 12px;
            color: #888888;
        }

        .sub-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: #ffffff;
            border: 1px solid #dcdcdc;
            color: #222222;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 5px;
            cursor: pointer;
            min-height: 34px;
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            background: #f5f5f5;
            border-color: #b0b0b0;
            color: #111111;
        }

        .action-btn-delete {
            color: #777777;
            border-color: #e5e5e5;
        }

        .action-btn-delete:hover {
            color: #111111;
            border-color: #888888;
            background: #f5f5f5;
        }

        .empty-text {
            text-align: center;
            padding: 40px 20px;
            color: #888888;
            font-size: 13px;
            border: 1px dashed #e0e0e0;
            border-radius: 8px;
            background: #ffffff;
        }

        /* Mobile Layout */
        @media (max-width: 640px) {
            body {
                padding: 20px 14px;
            }

            .input-group {
                flex-direction: column;
            }

            .btn-submit {
                width: 100%;
                padding: 13px;
            }

            .sub-item-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .sub-actions {
                width: 100%;
                display: flex;
                gap: 8px;
            }

            .sub-actions .action-btn {
                flex: 1;
                text-align: center;
                padding: 10px 0;
                font-size: 13px;
                min-height: 42px; /* Ergonomic touch target */
            }
        }

        /* Action Modal (Tap on Email Address) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #111111;
            margin-bottom: 4px;
            word-break: break-all;
            line-height: 1.4;
        }

        .modal-sub {
            font-size: 12px;
            color: #777777;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-btn {
            width: 100%;
            padding: 13px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid #dcdcdc;
            background: #ffffff;
            color: #222222;
            cursor: pointer;
            text-align: center;
            min-height: 44px;
            transition: all 0.15s ease;
        }

        .modal-btn:hover {
            background: #f7f7f7;
            border-color: #b0b0b0;
        }

        .modal-btn-delete {
            color: #666666;
            border-color: #e5e5e5;
        }

        .modal-btn-delete:hover {
            color: #111111;
            border-color: #888888;
            background: #f5f5f5;
        }

        .modal-btn-cancel {
            color: #888888;
            border-color: #eeeeee;
        }

        .modal-btn-cancel:hover {
            color: #222222;
            border-color: #cccccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Password Login Screen -->
        <div id="loginScreen">
            <h1>Cogniva</h1>
            <p>Enter your password to manage subscribers</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="login-box">
                    <input type="password" id="passwordInput" placeholder="Password..." required autofocus autocomplete="current-password">
                    <button type="submit" id="loginBtn" class="btn-submit">Unlock</button>
                </div>
            </form>
            <div id="loginAlert" style="margin-top: 14px; font-size: 12px; color: #666; display: none;"></div>
        </div>

        <!-- Authenticated Dashboard -->
        <div id="dashboardScreen">
            <header>
                <h1>Cogniva</h1>
                <div class="header-links">
                    <button type="button" class="header-btn" onclick="handleLogout()">Lock Dashboard</button>
                </div>
            </header>

            <div id="alertMsg"></div>

            <!-- Add Subscriber Section -->
            <div class="add-section">
                <div class="section-title">Add Subscriber</div>
                <form id="addForm" onsubmit="handleAddSubscriber(event)">
                    <div class="input-group">
                        <input type="email" id="emailInput" placeholder="Enter email address..." required autocomplete="off">
                        <button type="submit" id="addBtn" class="btn-submit">Add Subscriber</button>
                    </div>
                </form>
                <div class="add-note">New subscribers receive today's AI news digest instantly upon being added.</div>
            </div>

            <!-- Subscribers List Header -->
            <div class="list-header">
                <div class="list-title">Subscribers</div>
                <div class="list-count" id="countDisplay">0 subscribers</div>
            </div>

            <!-- Phone-first Subscriber Items List -->
            <div id="subscribersList" class="subscribers-list">
                <div class="empty-text">Loading subscribers...</div>
            </div>
        </div>
    </div>

    <!-- Subscriber Action Modal (Tap on Email Address) -->
    <div id="actionModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalEmail">subscriber@example.com</div>
            <div class="modal-sub" id="modalMeta">Status: Active | Added: 2026-09-10</div>
            <div class="modal-buttons">
                <button type="button" class="modal-btn" id="modalToggleBtn" onclick="handleModalToggle()">Pause Subscriber</button>
                <button type="button" class="modal-btn modal-btn-delete" onclick="handleModalDelete()">Remove Subscriber</button>
                <button type="button" class="modal-btn modal-btn-cancel" onclick="closeModalDirect()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const AUTH_KEY = 'cogniva_admin_auth';
        let currentModalEmail = '';
        let currentModalIsActive = true;

        function getAuthHeader() {
            return sessionStorage.getItem(AUTH_KEY) || '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById('passwordInput');
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('loginAlert');
            const pwd = input.value.trim();

            if (!pwd) return;

            btn.disabled = true;
            btn.innerText = 'Verifying...';

            try {
                const res = await fetch('/api/admin/subscribers', {
                    headers: { 'X-Admin-Password': pwd }
                });

                if (res.status === 401) {
                    alertBox.style.display = 'block';
                    alertBox.innerText = 'Incorrect password. Access denied.';
                    input.value = '';
                    input.focus();
                    return;
                }

                if (!res.ok) throw new Error('Verification failed');

                const data = await res.json();
                sessionStorage.setItem(AUTH_KEY, pwd);
                showDashboard(data.subscribers || []);
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.innerText = 'Error connecting to server. Please retry.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Unlock';
            }
        }

        function handleLogout() {
            sessionStorage.removeItem(AUTH_KEY);
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('passwordInput').value = '';
        }

        function showDashboard(subscribers) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            renderSubscribers(subscribers);
        }

        async function fetchSubscribers() {
            const pwd = getAuthHeader();
            if (!pwd) {
                handleLogout();
                return;
            }

            try {
                const res = await fetch('/api/admin/subscribers', {
                    headers: { 'X-Admin-Password': pwd }
                });

                if (res.status === 401) {
                    handleLogout();
                    return;
                }

                if (!res.ok) throw new Error('Failed to load subscribers');
                const data = await res.json();
                showDashboard(data.subscribers || []);
            } catch (err) {
                console.error(err);
                showAlert('Failed to load subscribers.', true);
            }
        }

        function renderSubscribers(subscribers) {
            document.getElementById('countDisplay').innerText = subscribers.length + ' subscriber' + (subscribers.length === 1 ? '' : 's');
            const container = document.getElementById('subscribersList');

            if (subscribers.length === 0) {
                container.innerHTML = '<div class="empty-text">No subscribers registered yet.</div>';
                return;
            }

            container.innerHTML = subscribers.map(s => {
                const isPaused = !s.is_active;
                const badgeClass = isPaused ? 'badge-paused' : 'badge-active';
                const badgeText = isPaused ? 'Paused' : 'Active';
                const toggleLabel = isPaused ? 'Resume' : 'Pause';
                const dateStr = s.subscribed_at || 'N/A';
                const cleanEmail = escapeHtml(s.email);
                const safeEmailArg = s.email.replace(/'/g, "\\'");
                const safeDateArg = dateStr.replace(/'/g, "\\'");

                return `
                    <div class="sub-item">
                        <div class="sub-item-header">
                            <button type="button" class="sub-email-btn" onclick="openModal('${safeEmailArg}', ${s.is_active}, '${safeDateArg}')" title="Click to manage subscriber">
                                ${cleanEmail}
                            </button>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="sub-item-meta">
                            <span class="sub-date">Added: ${escapeHtml(dateStr)}</span>
                            <div class="sub-actions">
                                <button type="button" class="action-btn" onclick="handleToggle('${safeEmailArg}')">${toggleLabel}</button>
                                <button type="button" class="action-btn action-btn-delete" onclick="handleDelete('${safeEmailArg}')">Remove</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(email, isActive, dateStr) {
            currentModalEmail = email;
            currentModalIsActive = isActive;

            document.getElementById('modalEmail').innerText = email;
            document.getElementById('modalMeta').innerText = (isActive ? 'Status: Active' : 'Status: Paused') + ' | Added: ' + dateStr;
            document.getElementById('modalToggleBtn').innerText = isActive ? 'Pause Subscriber' : 'Resume Subscriber';

            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target.id === 'actionModal') {
                closeModalDirect();
            }
        }

        function closeModalDirect() {
            document.getElementById('actionModal').style.display = 'none';
        }

        async function handleModalToggle() {
            const email = currentModalEmail;
            closeModalDirect();
            if (email) {
                await handleToggle(email);
            }
        }

        async function handleModalDelete() {
            const email = currentModalEmail;
            closeModalDirect();
            if (email) {
                await handleDelete(email);
            }
        }

        async function handleAddSubscriber(e) {
            e.preventDefault();
            const input = document.getElementById('emailInput');
            const btn = document.getElementById('addBtn');
            const email = input.value.trim().toLowerCase();

            if (!email) return;

            btn.disabled = true;
            btn.innerText = 'Adding & Sending...';

            try {
                const res = await fetch('/api/admin/subscribers/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': getAuthHeader()
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to add subscriber');

                showAlert('Subscriber added. Digest email sent to ' + email + ' instantly.');
                input.value = '';
                fetchSubscribers();
            } catch (err) {
                showAlert(err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Add Subscriber';
            }
        }

        async function handleToggle(email) {
            try {
                const res = await fetch('/api/admin/subscribers/toggle', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': getAuthHeader()
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to update subscriber');

                showAlert('Status updated for ' + email + ' (' + data.status + ').');
                fetchSubscribers();
            } catch (err) {
                showAlert(err.message, true);
            }
        }

        async function handleDelete(email) {
            if (!confirm('Are you sure you want to permanently remove ' + email + '?')) {
                return;
            }

            try {
                const res = await fetch('/api/admin/subscribers/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': getAuthHeader()
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to delete subscriber');

                showAlert('Subscriber ' + email + ' removed.');
                fetchSubscribers();
            } catch (err) {
                showAlert(err.message, true);
            }
        }

        function showAlert(msg, isError) {
            const el = document.getElementById('alertMsg');
            el.style.display = 'block';
            el.style.borderColor = isError ? '#bbbbbb' : '#d0d0d0';
            el.innerText = msg;
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Auto load if password saved
        if (getAuthHeader()) {
            fetchSubscribers();
        }
    </script>
</body>
</html>
