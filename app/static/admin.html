<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogniva Subscribers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.5;
            padding: 48px 24px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #111111;
            letter-spacing: -0.4px;
        }

        .nav-link {
            font-size: 13px;
            color: #777777;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .nav-link:hover {
            color: #111111;
        }

        /* Add Subscriber Box */
        .add-box {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 32px;
        }

        .add-box-title {
            font-size: 13px;
            font-weight: 600;
            color: #222222;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="email"] {
            flex: 1;
            padding: 10px 14px;
            font-size: 13px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            background: #ffffff;
            color: #222222;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input[type="email"]:focus {
            border-color: #555555;
        }

        button {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .btn-primary:hover {
            background-color: #111111;
            border-color: #111111;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-note {
            font-size: 12px;
            color: #888888;
            margin-top: 8px;
        }

        /* Subscribers List */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-title {
            font-size: 14px;
            font-weight: 600;
            color: #222222;
        }

        .list-count {
            font-size: 12px;
            color: #888888;
        }

        .table-wrap {
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: #fafafa;
            color: #666666;
            font-weight: 500;
            padding: 12px 20px;
            border-bottom: 1px solid #eaeaea;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            color: #444444;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .badge-active {
            background: #f5f5f5;
            color: #222222;
            border-color: #cccccc;
        }

        .badge-paused {
            background: #fafafa;
            color: #999999;
            border-color: #e5e5e5;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #dcdcdc;
            color: #444444;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            margin-right: 6px;
        }

        .action-btn:hover {
            background: #f7f7f7;
            color: #111111;
            border-color: #b0b0b0;
        }

        .action-btn-delete {
            color: #888888;
            border-color: #e5e5e5;
        }

        .action-btn-delete:hover {
            color: #222222;
            border-color: #999999;
            background: #fafafa;
        }

        .empty-text {
            text-align: center;
            padding: 40px;
            color: #888888;
            font-size: 13px;
        }

        #alertMsg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid #d0d0d0;
            background: #fafafa;
            color: #222222;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cogniva Subscribers</h1>
            <a href="/" class="nav-link">Back to Signup Page</a>
        </header>

        <div id="alertMsg"></div>

        <!-- Add Subscriber -->
        <div class="add-box">
            <div class="add-box-title">Add New Subscriber</div>
            <form id="addForm" onsubmit="handleAddSubscriber(event)">
                <div class="input-group">
                    <input type="email" id="emailInput" placeholder="Enter email address..." required autocomplete="off">
                    <button type="submit" id="addBtn" class="btn-primary">Add Subscriber</button>
                </div>
            </form>
            <div class="add-note">New subscribers receive today's AI news digest instantly upon being added.</div>
        </div>

        <!-- Subscribers Table -->
        <div class="list-header">
            <div class="list-title">All Subscribers</div>
            <div class="list-count" id="countDisplay">0 subscribers</div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Email Address</th>
                        <th>Date Added (UTC)</th>
                        <th>Status</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="empty-text">Loading subscribers...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchSubscribers() {
            try {
                const res = await fetch('/api/admin/subscribers');
                if (!res.ok) throw new Error('Failed to load subscribers');
                const data = await res.json();
                renderTable(data.subscribers || []);
            } catch (err) {
                console.error(err);
                showAlert('Failed to load subscribers. Please refresh.', true);
            }
        }

        function renderTable(subscribers) {
            document.getElementById('countDisplay').innerText = subscribers.length + ' subscriber' + (subscribers.length === 1 ? '' : 's');
            const tbody = document.getElementById('tableBody');

            if (subscribers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-text">No subscribers registered yet.</td></tr>';
                return;
            }

            tbody.innerHTML = subscribers.map(s => {
                const isPaused = !s.is_active;
                const badgeClass = isPaused ? 'badge-paused' : 'badge-active';
                const badgeText = isPaused ? 'Paused' : 'Active';
                const toggleLabel = isPaused ? 'Resume' : 'Pause';

                return `
                    <tr>
                        <td style="font-weight: 500; color: #111;">${escapeHtml(s.email)}</td>
                        <td>${escapeHtml(s.subscribed_at || 'N/A')}</td>
                        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                        <td style="text-align: right;">
                            <button class="action-btn" onclick="handleToggle('${escapeHtml(s.email)}')">${toggleLabel}</button>
                            <button class="action-btn action-btn-delete" onclick="handleDelete('${escapeHtml(s.email)}')">Remove</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function handleAddSubscriber(e) {
            e.preventDefault();
            const input = document.getElementById('emailInput');
            const btn = document.getElementById('addBtn');
            const email = input.value.trim().toLowerCase();

            if (!email) return;

            btn.disabled = true;
            btn.innerText = 'Adding & Sending Mail...';

            try {
                const res = await fetch('/api/admin/subscribers/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to add subscriber');

                showAlert('Subscriber added. News digest email dispatched to ' + email + ' immediately.');
                input.value = '';
                fetchSubscribers();
            } catch (err) {
                showAlert(err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Add Subscriber';
            }
        }

        async function handleToggle(email) {
            try {
                const res = await fetch('/api/admin/subscribers/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to update subscriber');

                showAlert('Status updated for ' + email + ' (' + data.status + ').');
                fetchSubscribers();
            } catch (err) {
                showAlert(err.message, true);
            }
        }

        async function handleDelete(email) {
            if (!confirm('Are you sure you want to permanently remove ' + email + '?')) {
                return;
            }

            try {
                const res = await fetch('/api/admin/subscribers/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to delete subscriber');

                showAlert('Subscriber ' + email + ' removed.');
                fetchSubscribers();
            } catch (err) {
                showAlert(err.message, true);
            }
        }

        function showAlert(msg, isError) {
            const el = document.getElementById('alertMsg');
            el.style.display = 'block';
            el.style.borderColor = isError ? '#bbbbbb' : '#d0d0d0';
            el.innerText = msg;
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        fetchSubscribers();
    </script>
</body>
</html>
